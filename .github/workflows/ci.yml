name: React CI/CD Pipeline with software testing and DevSecOps

# This triggers the workflow on pushes and pull requests to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$release_url/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep -F "  $archive" checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history for secrets
        run: gitleaks git --redact --exit-code 1 .

  sast-codeql:
    name: SAST - CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  build:
    name: Build
    runs-on: ubuntu-latest  # This specifies the OS for the job

    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # Checks out the code from your repository

      - name: Set up Node.js
        uses: actions/setup-node@v2  # Sets up the Node.js environment
        with:
          node-version: 20  # Specifies the version of Node.js

      - name: Install dependencies
        run: npm install  # Installs the required dependencies

      - name: Build the app
        run: npm run build  # Builds the React app for production

  tests:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Use Node.js 20 to run Test
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Tests
        run: npm run test

      #- name: Build the app
      #  run: npm run build  # Builds the React app for production
  # Job to deploy the application after build
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [tests, dependency-audit, secret-scan, sast-codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      vercel_url: ${{ steps.deploy-vercel.outputs.DEPLOY_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 #  Re-checks out the code for deployment

      - name: Deploy to Vercel
        id: deploy-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # 💡 Usamos --confirm y limpiamos la salida para extraer SOLO la URL limpia
        run: |
          URL=$(npx vercel --prod --yes --token $VERCEL_TOKEN | tail -n 1)
          echo "DEPLOY_URL=$URL" >> $GITHUB_OUTPUT

  cypress-e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout Cypress repo
        uses: actions/checkout@v4
        with:
          repository: 'mikyEsanino/cypress15'
          token: ${{ secrets.MI_GITHUB_TOKEN_REPOS }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Force Install Cypress Module
        run: npm install cypress --save-dev

      - name: Debug URL
        run: echo "La URL recibida de Vercel es ${{ needs.deploy.outputs.vercel_url }}"
          
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: ${{ needs.deploy.outputs.vercel_url }}
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE: false
          CYPRESS_VIDEO: false
          # 💡 Evita problemas de renderizado de fuentes/gráficas virtuales en Linux sin GUI
          ELECTRON_DISABLE_GPU: 1
          DISABLE_X1IR_WORKAROUNDS: true
        with:
          install: false
          component: false
          record: false
          publish-summary: true
          # 💡 Forzamos el uso de Chrome en lugar de Electron, ya que gestiona mejor la memoria en GitHub Actions
          browser: chrome